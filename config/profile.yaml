# Kipeo Afrika opportunity profile — the single source of truth for relevance scoring.
# Edit freely, then reload from Settings (or `npm run cli -- rescore`).
#
# Kipeo's business: organisations PAY KIPEO to BUILD software for them and then MAINTAIN it.
# The score therefore asks four questions:
#   1. Is this a build-or-maintain software job?      (core capabilities — the dominant signal)
#   2. Is the buyer the kind of organisation we serve? (buyers — SACCOs, schools, hospitals, NGOs, SMEs…)
#   3. Can we realistically respond?                   (geography, engagement type, deadline)
#   4. Is it actually something else?                  (penalties — hardware supply, policy work, staff jobs, grants)
#
# Matching rules: terms are case-insensitive whole-word/phrase matches (hyphens and spaces are
# interchangeable); `acronyms` are case-sensitive; title hits weigh ~4x description hits.

company:
  name: Kipeo Afrika
  website: https://kipeoafrika.com
  base: Nairobi, Kenya
  pitch: >-
    Kipeo Afrika is a Nairobi-based software company. Organisations pay Kipeo to design and build
    custom software for them — business applications, web and mobile apps, portals, management
    information systems, integrations and workflow automation — and then to host, support and
    maintain those systems on an ongoing basis. Kipeo also brings cloud/DevSecOps and application
    security expertise, and trains client teams through Kipeo Academy. Ideal clients are SACCOs and
    microfinance institutions, schools, colleges and universities, hospitals and clinics, NGOs and
    faith-based organisations, property managers, SMEs, associations and county-level public bodies.
    Kipeo is early-stage and building its case-study library.

