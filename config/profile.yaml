# Who is paying? Kipeo's sweet spot is organisations big enough to pay for software but not
# mega-programmes. The highest-weight matching group wins; title and buyer name are matched.
buyers:
  default: 0.55
  groups:
    - label: SACCOs & microfinance
      weight: 1.0
      terms: [sacco, saccos, savings and credit, cooperative society, co-operative society, cooperative, microfinance, mfi, credit union, chama, investment group]
    - label: Schools, colleges & universities
      weight: 1.0
      terms: [school, academy, college, polytechnic, university, institute, tvet, training institute, ecde]
    - label: Hospitals & clinics
      weight: 1.0
      terms: [hospital, clinic, medical centre, medical center, health centre, nursing home, pharmacy, mission hospital]
    - label: NGOs & faith-based organisations
      weight: 1.0
      terms: [ngo, non-governmental, foundation, charity, trust, church, diocese, catholic, anglican, mosque, world vision, red cross, save the children, plan international, care international, mercy corps, oxfam, amref]
    - label: SMEs, associations & property
      weight: 1.0
      terms: [limited, ltd, company, enterprises, association, society, chamber, federation, property management, real estate, housing, estate, hotel, insurance]
    - label: County & local public bodies
      weight: 0.85
      terms: [county government, county assembly, county, water and sanitation company, water services, sub-county, municipality, municipal, board, fund]
    - label: National government & parastatals
      weight: 0.6
      terms: [ministry, state department, authority, commission, agency, corporation, national, government, parliament, judiciary]
    - label: Multilateral & regional programmes
      weight: 0.15
      terms: [world bank, african union, union commission, african development bank, regional, multinational, igad, comesa, sadc, ecowas, east african community, united nations, unicef, undp, unops, secretariat]

