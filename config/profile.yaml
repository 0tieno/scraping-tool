# Engagement-type preference (0..1).
opportunityTypes:
  rfp: 1.0
  rfq: 0.9
  eoi: 0.9
  tender: 0.85
  consultancy: 0.8
  framework: 0.8
  notice: 0.3
  grant: 0.0
  other: 0.5

# Procurement category multiplier on the type score (longest matching key wins).
categories:
  goods: 0.5
  works: 0.0
  services: 1.0
  non consultancy services: 1.0
  non-consulting services: 1.0
  consultancy services: 0.9
  consulting services: 0.9

# Notices in other languages are penalised (Kipeo bids in English).
languages:
  accepted: [en]
  penalty: 15

# Things that look relevant but aren't Kipeo's business. `waivedByCore: true` drops the penalty
# when the TITLE clearly names software build/maintenance work (e.g. "Supply and installation of
# an ERP system" is fine; "Supply of laptops and printers" is not). Each group applies once.
penalties:
  - id: hardware
    label: Hardware / equipment supply
    points: 30
    waivedByCore: true
    terms: [supply and delivery, supply, delivery and installation, equipment, computers, laptops, desktops, tablets, printers, photocopiers, servers, hardware, cctv, wi-fi, wifi, routers, switches, network equipment, cabling, structured cabling, backbone, fibre, fiber, satellite, radio, ups, generator, solar, x-ray, biometric devices, kiosks, toner, cartridges, furniture]
  - id: advisory
    label: Policy / strategy / study work
    points: 25
    waivedByCore: true
    terms: [policy, strategy, strategic plan, framework for, standards, governance, feasibility study, master plan, baseline survey, baseline study, endline, end-term evaluation, mid-term evaluation, evaluation of, impact assessment, research, study, situational analysis, needs assessment, review of, audit of financial statements, technical assistance, transaction advisor, advisory services]
  - id: staff-role
    label: Staff job or individual post
    points: 45
    waivedByCore: false
    terms: [individual consultant, national consultant, international consultant, vacancy, vacancies, job opening, position of, officer, manager, coordinator, specialist, associate, assistant, director, intern, internship, volunteer, fellow, nurse, driver, lead, supervisor, head of, fixed-term, fixed term, expert, trainee, graduate, graduate trainee]
  - id: not-a-client
    label: Grant, scholarship or competition (not a paying client)
    points: 45
    waivedByCore: false
    terms: [grant, grants, call for proposals, funding opportunity, scholarship, fellowship, award, awards, prize, competition, accelerator, incubator, apply now, programme application, program application]
  - id: out-of-lane
    label: Construction, goods or unrelated services
    points: 30
    waivedByCore: true
    terms: [construction of, civil works, rehabilitation of, road, roads, borehole, drilling, fuel, motor vehicle, motor vehicles, tyres, foodstuff, foodstuffs, food items, catering, cleaning services, fumigation, security guard, guarding services, security services, uniforms, stationery, pharmaceuticals, drugs, medical equipment, laboratory, reagents, fertilizer, seeds, livestock, building materials, plumbing, electrical works, streetlights, street lights, water supply, sewer, irrigation, toilet, fencing, insurance cover, medical cover, disposal of, sale of, hire of, travel agency, air tickets, printing, advertising, branding, recruitment of staff, poultry, agro-processing, lifts, air conditioning]

